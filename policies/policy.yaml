# Cortexa runtime policy. Loaded at startup and on change.
# Clinical wording is owned by the premed teammate (contributor: computer
# engineer). Edits here must change agent behavior without code changes.

classifier:
  min_confidence_for_auto_suggest: 0.99   # below this, set flagged_uncertain (doctor still confirms every case). 0.99 flags 20 of 32 test errors and 3.3% of correct calls; 0.80 flagged only 6 of 32 (see classifier/README.md)
  flag_on_model_disagreement: true
  medgemma_vote: false                    # true = MedGemma's call counts as a second opinion; off until its eval is good enough (classifier/medgemma/eval.json)
  label_prefix: "Suspected"               # never "Diagnosis"

# Doctor approval gates (safety rule 2) are not configurable here: code
# requires every gate in schemas.Gate. See agent/workflow.py GATE_AT_STAGE.

eligibility:
  missing_field_status: unknown
  missing_field_reason_template: "needs pathology: {field}"
  require_evidence_citation: true

trial_search:
  statuses: [RECRUITING, NOT_YET_RECRUITING]
  status_labels:                  # shown in the UI; every status above needs one
    RECRUITING: "Recruiting"
    NOT_YET_RECRUITING: "Not yet recruiting: enrollment has not opened"
  # No distance cutoff: every eligible trial is shown, sorted nearest first.
  # Remote trials and trials with no site location are listed last.
  # Shortlist groups: a trial whose only open questions are routine items
  # (labs, washout, device use) is "eligible on what we know". A trial with an
  # unknown on one of these fields goes under "needs a test", which names the
  # test. Field names match the eligibility evidence_field. Edit freely.
  key_unknown_fields: [idh, codeletion_1p19q, mgmt, tmb_clia]
  no_match_plan:
    show_near_misses: true        # fails exactly one rule, or depends on a pending result
    alert_on_new_trials: true
    log_for_tumor_board: true

mutation_check:
  run_only_for: recurrent_glioma
  require_broad_sequencing: true  # exome or genome; skip small panels
  false_alarm_rate: 0.01
  never_route_to_immunotherapy_on_mutation_count: true

# Pre-op screen (glioma): flag trials that need enrollment before surgery.
# Phrases match case-insensitive, inside the named criteria list only.
# "prior resection" in an INCLUSION list means a recurrent-tumor trial, so it
# is not listed there. Add phrases here; no code change needed.
pre_surgery_detection:
  inclusion_phrases:
    - "before planned surgical resection"
    - "before resection"
    - "prior to resection"
    - "prior to surgery"
    - "before surgery"
    - "pre-operative"
    - "preoperative"
    - "presurgical"
    - "window of opportunity"
    - "neoadjuvant"
  exclusion_phrases:
    - "prior brain surgery"
    - "prior resection"
    - "prior surgery or biopsy"
  # A title hint alone is never a confirmed flag. Code lists it as
  # "possible, check criteria" (matched_on: title_hint) and the doctor must
  # answer it at preop_review. An LLM criteria check may confirm it later.
  title_hints: ["window-of-opportunity", "neoadjuvant", "pre-operative"]
  # Only trials whose conditions or title name one of these are screened (pre-op is glioma only).
  condition_keywords: [glioma, glioblastoma, astrocytoma, oligodendroglioma]
  llm_confirm_on_title_hint_only: true

privacy:
  geocode_fields_allowed: [zip, city]
  patient_contact: never

audit:
  log_every_tool_call: true
  log_every_approval: true
