<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortexa · Agentic Care Management (mockup)</title>
<style>
:root{
  --bg:#0B1830; --panel:#0E1E38; --panel2:#132848; --line:#22365C; --line2:#2E4672;
  --text:#F4EFE3; --mint:#A8EBDD; --tangerine:#F2894B; --tangerine-bg:rgba(242,137,75,.15); --muted:#B7BCC2; --faint:#7D88A0;
  --teal:#22C4B7; --teal-bg:rgba(34,196,183,.14); --teal-text:#7FE6DC;
  --ai:#1998DD; --ai-line:#3BA7E8; --ai-bg:rgba(25,152,221,.16); --ai-text:#A6D8F7;
  --blue:#1998DD; --cyan:#64E6FF;
  --warn:#E8B54A; --warn-bg:rgba(232,181,74,.13);
  --danger:#F2894B; --danger-bg:rgba(242,137,75,.15);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Montserrat","Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:40px;width:auto;display:block}
.wordmark{line-height:1}
.wordmark .name{font-weight:700;font-size:22px;letter-spacing:.2px;color:var(--text)}
.wordmark .name span{color:var(--teal)}
.wordmark .tagline{font-size:9.5px;letter-spacing:1.6px;color:var(--muted);margin-top:4px;font-weight:600}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:transparent;color:var(--muted);font-weight:500;border:1px dashed var(--line2)}
.tabs{display:flex;gap:4px;margin-left:16px;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font:inherit;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.tabs button:hover{color:var(--mint)}
.spacer{flex:1}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Kanban */
#kanban{display:flex;gap:12px;padding:16px 20px;overflow-x:auto;min-height:calc(100vh - 62px);align-items:flex-start}
.col{flex:0 0 220px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.col h3{margin:2px 4px 8px;font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.col h3 .n{background:var(--panel2);border-radius:999px;padding:0 7px;font-weight:500;color:var(--text)}
.colhead{min-height:178px;display:flex;flex-direction:column;margin:-10px -10px 10px;padding:10px 10px 10px;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;background:linear-gradient(180deg,rgba(34,196,183,.06),transparent)}
.colhead h3{margin:2px 0 6px}
.waitlabel{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:600}
.waittext{font-size:12px;color:var(--text);margin-top:2px;line-height:1.35;flex:1}
.owner{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;font-weight:600}
.owner .av{width:32px;height:32px;border-radius:7px;flex:none;object-fit:cover}
.owner.doctor{color:var(--teal-text)}
.owner.agent{color:var(--ai-text)}
.owner.lab{color:var(--warn)}
.owner.none{color:var(--faint);font-weight:500}
.owner small{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:600}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 14px rgba(168,235,221,.18)}
/* Severity shading: any suspected/confirmed tumor stands out; no tumor recedes */
.card.tumor{background:linear-gradient(90deg,#B23A3A 0 3px,rgba(178,58,58,.14) 3px,rgba(178,58,58,0) 70%),var(--panel2)}
.card.no-tumor{background:var(--panel);border-color:rgba(34,54,92,.7)}
.card.no-tumor .id,.card.no-tumor .bucket{color:var(--muted)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .id{font-weight:700;font-size:13px}
.card .demo{font-size:12px;color:var(--muted)}
.card .bucket{font-size:12px;margin-top:4px}
.card .next{font-size:12px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(183,188,194,.12);color:var(--muted)}
.chip.doc{background:var(--teal-bg);color:var(--teal-text)}
.chip.ai{background:var(--ai-bg);color:var(--ai-text)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.danger{background:var(--danger-bg);color:var(--danger);font-weight:600}

/* Pathway */
#pathway{display:none;grid-template-columns:230px minmax(420px,1fr) 320px;gap:16px;padding:16px 20px;height:calc(100vh - 62px)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
.list .row{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.list .row:hover{background:var(--panel2);box-shadow:inset 3px 0 0 var(--mint)}
.list .row.on{background:var(--teal-bg);box-shadow:inset 3px 0 0 var(--teal)}
.list .row small{display:block;color:var(--muted);font-size:11px}
.canvas{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;display:flex;justify-content:center;padding:8px}
.canvas svg{height:100%;max-height:1100px;width:auto}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;overflow:auto}
.detail h2{margin:0 0 2px;font-size:18px;font-weight:700}
.detail .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;margin:10px 0}
.kv div:nth-child(odd){color:var(--muted)}
.box{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px;font-size:13px;background:var(--panel2)}
.box.gate{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-text)}
.box.gate button{margin-top:8px;border:0;background:var(--tangerine);color:#2A1405;padding:7px 14px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 12px rgba(242,137,75,.35)}
.box.gate button:hover{background:#F59D66}
.box h4{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--text)}
.box.urgent{border-color:var(--tangerine);background:var(--tangerine-bg)}
.box.urgent h4{color:var(--tangerine)}
.ptrial{margin-top:8px;padding:8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
.ptrial .ptitle{margin-top:4px}
.ptrial .crit{font-size:12px;margin-top:4px;color:var(--muted)}
.ptrial .crit span{text-transform:uppercase;font-size:10px;letter-spacing:1px;color:var(--faint);margin-right:4px}
.choice{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:12px}
.proposed{margin-top:6px;font-size:11px;color:var(--faint)}
.steps{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--faint)}
.steps li.done{color:var(--text)}
.steps li.cur{color:var(--cyan);font-weight:700}

/* SVG states */
.n rect{stroke-width:1;transition:all .2s}
.n.neutral rect{fill:var(--panel2);stroke:var(--line2)}
.n.ai rect{fill:var(--ai-bg);stroke:var(--ai-line)}
.n.doc rect{fill:var(--teal-bg);stroke:var(--teal)}
.n text{font-family:inherit}
.n .t{font-size:14px;font-weight:600;fill:var(--text)}
.n .s{font-size:12px;fill:var(--muted)}
.n.ai .t{fill:var(--ai-text)} .n.ai .s{fill:#6FBFEA}
.n.doc .t{fill:var(--teal-text)} .n.doc .s{fill:var(--teal)}
svg.focus .n{opacity:.25}
svg.focus .n.visited,svg.focus .n.cur,svg.focus .n.proj{opacity:1}
svg.focus .n.proj rect{stroke-dasharray:5 4;fill:transparent}
svg.focus .n.visited rect{stroke-width:1.6}
svg.focus .n.cur rect{stroke-width:2.5;stroke:var(--cyan)}
svg.focus .n.cur{filter:drop-shadow(0 0 6px rgba(100,230,255,.75))}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
svg.focus .n.cur rect{animation:pulse 1.6s ease-in-out infinite}
.e{fill:none;stroke:#3A5080;stroke-width:1.5}
svg.focus .e{stroke:#1C2E52}
svg.focus .e.visited{stroke:url(#gradOn);stroke-width:3}
svg.focus .e.proj{stroke:#5E7BA6;stroke-width:2;stroke-dasharray:6 5;opacity:.7}
.el{font-size:12px;fill:var(--faint)}
@media (prefers-reduced-motion:reduce){svg.focus .n.cur rect{animation:none}}
</style>
</head>

function ownerBadge(o){
  const k = o||'none', NAME = {doctor:'Doctor',agent:'Agent',lab:'Pathology lab',none:'No owner'};
  return `<div class="owner ${k}"><img class="av" src="${ACTOR_ICON[k]}" alt="${NAME[k]}"><span><small>Owner</small>${NAME[k]}</span></div>`;
}
function renderKanban(){
  const el = document.getElementById('kanban'); el.innerHTML='';
  COLS.forEach(c=>{
    const items = P.filter(p=>c.nodes.includes(p.cur));
    const col = document.createElement('div'); col.className='col';
    const counts = {};
    items.forEach(p=>{ const w=NEXT[p.cur][0]; counts[w]=(counts[w]||0)+1; });
    const order = ['doctor','pathology','agent','none'];
    const waitChips = order.filter(w=>counts[w]).map(w=> w==='none'
        ? `<span class="chip">Closed · ${counts[w]}</span>`
        : `<span class="chip ${WAIT_CLASS[w]}">${w[0].toUpperCase()+w.slice(1)} · ${counts[w]}</span>`).join('')
      || '<span class="chip">None waiting</span>';
    col.innerHTML = `<div class="colhead">
        <h3>${c.title}<span class="n">${items.length}</span></h3>
        ${ownerBadge(c.owner)}
        <div class="waitlabel">Waiting on</div>
        <div class="waittext">${c.wait}</div>
        <div class="chips">${waitChips}</div>
      </div>` + items.map(p=>{
      const [who,what]=NEXT[p.cur];
      const wait = who==='none'?'':`<span class="chip ${WAIT_CLASS[who]}">Waiting on ${who}</span>`;
      return `<div class="card ${(p.confirmed||p.sus)==='No tumor'?'no-tumor':'tumor'}" onclick="openPatient('${p.id}')">
        <div class="top"><span class="id">${p.id}</span><span class="demo">${p.age}${p.sex} · ${p.zip}</span></div>
        <div class="bucket">Suspected: <b>${p.sus}</b> <span class="demo">(${Math.round(p.conf*100)}%)</span>${p.confirmed?`<br>Confirmed by doctor: <b>${p.confirmed}</b>`:''}</div>
        <div class="next">${what}</div>
        <div class="chips">${wait}${(p.flags||[]).map(flagChip).join('')}</div>
      </div>`;}).join('');
    el.appendChild(col);
  });
}

/* ---------- Pathway SVG ---------- */
function marker(id,color){return `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>`}
function buildTree(){
  const svg = document.getElementById('tree');
  let h = `<defs><linearGradient id="gradOn" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1200"><stop offset="0" stop-color="#64E6FF"/><stop offset=".5" stop-color="#1998DD"/><stop offset="1" stop-color="#22C4B7"/></linearGradient>${marker('a-off','#3A5080')}${marker('a-dim','#1C2E52')}${marker('a-on','#64E6FF')}${marker('a-proj','#5E7BA6')}</defs>`;
  for(const [k,d] of Object.entries(EDGES)) h += `<path class="e" data-k="${k}" d="${d}" marker-end="url(#a-off)"/>`;
  EDGE_LABELS.forEach(l=> h += `<text class="el" x="${l.x}" y="${l.y}">${l.t}</text>`);
  NODES.forEach(n=>{
    const cx=n.x+n.w/2;
    h += `<g class="n ${n.k}" data-id="${n.id}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"/>`;
    if(n.s){ h += `<text class="t" x="${cx}" y="${n.y+19}" text-anchor="middle" dominant-baseline="central">${n.t}</text><text class="s" x="${cx}" y="${n.y+38}" text-anchor="middle" dominant-baseline="central">${n.s}</text>`; }
    else { h += `<text class="t" x="${cx}" y="${n.y+n.h/2}" text-anchor="middle" dominant-baseline="central">${n.t}</text>`; }
    h += `</g>`;
  });
  svg.innerHTML = h;
}
function highlight(p){
  const svg = document.getElementById('tree'); svg.classList.add('focus');
  const ci = p.route.indexOf(p.cur);
  const visited = new Set(p.route.slice(0,ci)), proj = new Set(p.route.slice(ci+1));
  svg.querySelectorAll('.n').forEach(g=>{
    const id=g.dataset.id; g.classList.remove('visited','cur','proj');
    if(id===p.cur) g.classList.add('cur'); else if(visited.has(id)) g.classList.add('visited'); else if(proj.has(id)) g.classList.add('proj');
  });
  const edgeState = {};
  p.route.forEach((id,i)=>{ if(i===0) return; const k=p.route[i-1]+'>'+id; edgeState[k]= i<=ci?'visited':'proj'; });
  svg.querySelectorAll('.e').forEach(e=>{
    const s=edgeState[e.dataset.k]; e.classList.remove('visited','proj');
    if(s) e.classList.add(s);
    e.setAttribute('marker-end', s==='visited'?'url(#a-on)':s==='proj'?'url(#a-proj)':'url(#a-dim)');
  });
  // keep shared trunk segments drawn on top when highlighted
  svg.querySelectorAll('.e.proj').forEach(e=>svg.insertBefore(e, svg.querySelector('.el')));
  svg.querySelectorAll('.e.visited').forEach(e=>svg.insertBefore(e, svg.querySelector('.el')));
}

/* ---------- Detail + list ---------- */
function renderList(){
  document.getElementById('plist').innerHTML = P.map(p=>`<div class="row ${p.id===selected?'on':''}" onclick="openPatient('${p.id}')">${p.id} · ${p.confirmed||p.sus}<small>${nodeById[p.cur].t}</small></div>`).join('');
}
/* Pre-surgery trials: same shape as pre_surgery_trials in agent/tests/fixtures/preop_screen.json.
   Status wording mirrors policy.yaml trial_search.status_labels. */
const STATUS_LABEL = {RECRUITING:'Recruiting', NOT_YET_RECRUITING:'Not yet recruiting: opens soon, cannot enroll yet'};
const PRESURG_TRIALS = {
  NCT99000003:{title:'[SYNTHETIC] Window-of-opportunity drug before resection in suspected glioblastoma',
    status:'NOT_YET_RECRUITING',criterion:'Must enroll before planned surgical resection',site:'Austin, TX',miles:86.7,minutes:110}
};
function presurgBox(p){
  if(!p.presurg) return '';
  const atPreop = p.cur==='preop';
  const trials = p.presurg.map(id=>{ const t=PRESURG_TRIALS[id]; return `<div class="ptrial">
      <div><b>${id}</b> <span class="chip ${t.status==='RECRUITING'?'doc':'warn'}">${STATUS_LABEL[t.status]}</span></div>
      <div class="ptitle">${t.title}</div>
      <div class="crit"><span>Criterion</span>"${t.criterion}"</div>
      <div class="demo">Nearest site: ${t.site} · ${t.miles} mi · about ${t.minutes} min drive</div>
      ${atPreop?`<div class="choice"><label><input type="radio" name="ps-${p.id}-${id}"> Pursue before surgery</label><label><input type="radio" name="ps-${p.id}-${id}"> Not pursuing</label></div>`:''}
    </div>`; }).join('');
  return atPreop
    ? `<div class="box urgent"><h4>Enroll before surgery</h4>This trial only accepts patients before resection. Once surgery happens the patient can no longer join. Mark each trial before the case moves to surgery.${trials}</div>`
    : `<div class="box"><h4>Pre-surgery trial (flagged at pre-op screen)</h4>${trials}</div>`;
}
/* Shortlist: every eligible trial, no distance cutoff, nearest first (same order as Shortlist.trials).
   Sites and distances are from the demo cache (agent/demo_cache, origin ZIP 77840). */
const SHORTLIST_TRIALS = {
  NCT99000001:{title:'[SYNTHETIC] IDH inhibitor in newly diagnosed IDH-mutant grade 2-3 astrocytoma',status:'RECRUITING',site:'Houston, TX',miles:84.6,minutes:105},
  NCT99000004:{title:'[SYNTHETIC] Radiation plus novel agent in newly diagnosed MGMT-unmethylated glioblastoma',status:'RECRUITING',site:'Austin, TX',miles:86.7,minutes:110},
  NCT99000005:{title:'[SYNTHETIC] Adjuvant therapy after resection of WHO grade 2-3 meningioma',status:'RECRUITING',site:'San Antonio, TX',miles:154.8,minutes:165},
  NCT99000006:{title:'[SYNTHETIC] Oral medication for ACTH-secreting pituitary adenoma (Cushing disease)',status:'NOT_YET_RECRUITING',site:'Houston, TX',miles:84.6,minutes:105},
  NCT99000007:{title:'[SYNTHETIC] Chemoradiation strategies in IDH-mutant 1p/19q-codeleted oligodendroglioma',status:'RECRUITING',site:'New Orleans, LA',miles:376.1,minutes:360},
  NCT99000008:{title:'[SYNTHETIC] Decentralized symptom-management study in recurrent glioma (home participation)',status:'RECRUITING',site:'Oklahoma City, OK',miles:342.0,minutes:330,remote:true}
};
function shortlistBox(p){
  if(!p.shortlist || p.cur!=='sl') return '';
  const rows = p.shortlist.map(x=>typeof x==='string'?{id:x}:x)
    .map(x=>({...SHORTLIST_TRIALS[x.id],...x}))
    .sort((a,b)=>(a.local?0:a.miles??Infinity)-(b.local?0:b.miles??Infinity));
  const trials = rows.map(t=>`<div class="ptrial">
      <div><b>${t.id}</b> <span class="chip ${t.status==='RECRUITING'?'doc':'warn'}">${STATUS_LABEL[t.status]}</span>${t.remote?' <span class="chip doc">Remote participation</span>':''}</div>
      <div class="ptitle">${t.title}</div>
      <div class="demo">${t.local?`Nearest site: ${t.site} · in the patient's area`:`Nearest site: ${t.site} · ${t.miles} mi · about ${t.minutes} min drive`}${t.remote?' · visits from home':''}</div>
    </div>`).join('');
  return `<div class="box"><h4>Trial shortlist (nearest first, no distance cutoff)</h4>Every eligible trial is shown, however far away. The patient and care team decide whether the travel is worth it.${trials}</div>`;
}
function renderDetail(p){
  const [who,what]=NEXT[p.cur];
  const gate = who==='doctor'
    ? `<div class="box gate"><h4>Doctor action needed</h4>${what}<br><button onclick="alert('Mockup only: this would record the doctor decision and write it to the audit log.')">Record decision</button>${p.cur==='preop'?'<div class="proposed">Proposed doctor gate: not in the backend yet (issue #21)</div>':''}</div>`
    : `<div class="box"><h4>Status</h4>${what}${who!=='none'?` <span class="chip ${WAIT_CLASS[who]}">Waiting on ${who}</span>`:''}</div>`;
  const ci = p.route.indexOf(p.cur);
  const steps = p.route.map((id,i)=>`<li class="${i<ci?'done':i===ci?'cur':''}">${nodeById[id].t}</li>`).join('');
  document.getElementById('detail').innerHTML = `
    <h2>${p.id}</h2><div class="sub">Synthetic patient · ${p.age} ${p.sex==='F'?'female':'male'} · ZIP ${p.zip}</div>
    <div class="chips">${(p.flags||[]).map(flagChip).join('')}</div>
    <div class="kv"><div>Suspected</div><div><b>${p.sus}</b> (${Math.round(p.conf*100)}% confidence)</div>
    ${p.confirmed?`<div>Confirmed</div><div><b>${p.confirmed}</b> (doctor override)</div>`:''}<div>Current step</div><div>${nodeById[p.cur].t}</div></div>
    ${presurgBox(p)}
    ${shortlistBox(p)}
    ${gate}
    <div class="box"><h4>Scenario</h4>${p.scenario}</div>
    <div class="box"><h4>Route</h4><ol class="steps">${steps}</ol></div>
    <div class="box" style="color:var(--muted);font-size:12px">Solid glowing line = completed. Cyan glow = current step. Dashed = projected next steps.</div>`;
}
function openPatient(id){
  selected=id; const p=P.find(x=>x.id===id);
  show('pathway'); renderList(); renderDetail(p); highlight(p);
}
function show(v){
  document.getElementById('kanban').style.display = v==='kanban'?'flex':'none';
  document.getElementById('pathway').style.display = v==='pathway'?'grid':'none';
  document.getElementById('tabK').classList.toggle('on',v==='kanban');
  document.getElementById('tabP').classList.toggle('on',v==='pathway');
  if(v==='pathway'){ const p=P.find(x=>x.id===selected); renderList(); renderDetail(p); highlight(p); }
}
renderKanban(); buildTree();
</script>
